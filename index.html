<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="IYF">
<meta name="theme-color" content="#0a1510">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<title>IYF</title>
<style>
:root{
  --bg:#0a1510; --card:#12211a; --card2:#1a2e24; --line:#24402f;
  --text:#ecf5ef; --muted:#8aa596; --accent:#4ade80; --accent2:#15803d;
  --ok:#22c55e; --danger:#ff5f6d; --r:14px;
  --st:env(safe-area-inset-top); --sb:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
[hidden]{display:none!important}

/* Kilit ekranı */
#lock{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:calc(var(--st) + 24px) 24px calc(var(--sb) + 24px);max-width:420px;margin:0 auto}
.logo{width:84px;height:84px;border-radius:22px;background:linear-gradient(180deg,#0f3d26,#16a34a);display:grid;place-items:center;font-weight:800;font-size:28px;margin:0 auto 18px;letter-spacing:1px}
#lock h1{text-align:center;margin:0 0 6px;font-size:24px}
#lock p.sub{text-align:center;color:var(--muted);margin:0 0 24px;font-size:14px}
.err{color:var(--danger);font-size:14px;min-height:20px;text-align:center;margin-top:8px}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

/* Genel */
.input{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:13px 14px;outline:none;font-size:16px}
.input:focus{border-color:var(--accent)}
textarea.input{min-height:180px;resize:vertical}
.btn{width:100%;padding:14px;border-radius:12px;background:var(--accent2);color:#fff;font-weight:600;margin-top:12px}
.btn.ghost{background:var(--card2);color:var(--text)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid #4a2733}
.btn.sm{width:auto;padding:8px 12px;margin:0;font-size:14px;border-radius:10px}
label.f{display:block;font-size:13px;color:var(--muted);margin:12px 0 6px}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}

/* Uygulama iskeleti */
header{position:sticky;top:0;z-index:5;background:rgba(10,21,16,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:calc(var(--st) + 10px) 16px 10px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
header h1{flex:1;margin:0;font-size:22px}
.iconbtn{width:38px;height:38px;border-radius:12px;background:var(--card);display:grid;place-items:center}
.iconbtn svg{width:20px;height:20px}
main{padding:14px 16px calc(var(--sb) + 90px);max-width:640px;margin:0 auto}
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;background:rgba(14,27,20,.95);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 4px calc(var(--sb) + 6px)}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);padding:4px 0}
nav button svg{width:24px;height:24px}
nav button.on{color:var(--accent)}

.card{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:15px;color:var(--muted);font-weight:600;display:flex;justify-content:space-between;align-items:center}
.list{background:var(--card);border-radius:var(--r);overflow:hidden;margin-bottom:12px}
.item{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.item:last-child{border-bottom:0}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .t small{display:block;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{background:var(--card2);color:var(--accent);border-radius:8px;padding:3px 8px;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.avatar{width:36px;height:36px;border-radius:10px;background:var(--card2);display:grid;place-items:center;font-weight:700;color:var(--accent);flex:none}
.chev{color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:26px 10px;font-size:14px}
.check{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.check.on{background:var(--ok);border-color:var(--ok)}
.check.on::after{content:"";width:8px;height:13px;border:solid #0a1510;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.done b{text-decoration:line-through;color:var(--muted)}

.seg{display:flex;background:var(--card);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;padding:9px;border-radius:9px;color:var(--muted);font-weight:600;font-size:14px}
.seg button.on{background:var(--card2);color:var(--text)}
.days{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.days button{flex:1;min-width:44px;padding:8px 0;border-radius:12px;background:var(--card);color:var(--muted);font-size:13px;font-weight:600;position:relative}
.days button.on{background:var(--accent2);color:#fff}
.days button.today::after{content:"";position:absolute;bottom:4px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--ok)}
.search{margin-bottom:12px}
.addbtn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:13px;border-radius:var(--r);background:var(--card);color:var(--accent);font-weight:600;margin-bottom:12px}
.addbtn svg{width:20px;height:20px;flex:none}
.hello{font-size:26px;font-weight:700;margin:4px 0 2px}
.date{color:var(--muted);margin-bottom:16px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--card);border-radius:var(--r);padding:12px;text-align:center}
.stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.stat small{color:var(--muted);font-size:12px}
.back{color:var(--accent);font-weight:600;padding:4px 0 12px;display:flex;align-items:center;gap:4px}

/* Alt sayfa (sheet) */
#sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet-card{background:var(--card);width:100%;max-width:640px;max-height:92vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(var(--sb) + 18px);animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.sheet-card h2{margin:0 0 6px;font-size:19px}
.pwfield{position:relative}
.pwfield .input{padding-right:96px}
.pwfield .tools{position:absolute;right:6px;top:6px;display:flex;gap:4px}
.pwfield .tools button{width:38px;height:36px;border-radius:9px;background:var(--card);display:grid;place-items:center}
.pwfield .tools svg{width:18px;height:18px}
.kv{background:var(--card2);border-radius:12px;padding:10px 12px;margin-top:8px;display:flex;align-items:center;gap:8px}
.kv .t{flex:1;min-width:0}
.kv small{display:block;color:var(--muted);font-size:12px}
.kv span{display:block;word-break:break-all}
.mono{font-family:ui-monospace,"SF Mono",Menlo,monospace}
#toast{position:fixed;left:50%;bottom:calc(var(--sb) + 96px);transform:translateX(-50%);background:#fff;color:#111;padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}
.note-body{white-space:pre-wrap}
.hint{color:var(--muted);font-size:13px;margin-top:6px}
</style>
</head>
<body>

<!-- KİLİT EKRANI -->
<section id="lock">
  <div class="logo">IYF</div>
  <h1 id="lockTitle">IYF</h1>
  <p class="sub" id="lockSub"></p>
  <form id="lockForm" autocomplete="off">
    <input class="input" id="pw1" type="password" placeholder="Ana parola" autocomplete="current-password">
    <input class="input" id="pw2" type="password" placeholder="Ana parola (tekrar)" style="margin-top:10px" hidden>
    <button class="btn" id="lockBtn" type="submit">Kilidi aç</button>
    <div class="err" id="lockErr"></div>
  </form>
</section>

<!-- UYGULAMA -->
<div id="app" hidden>
  <header>
    <h1 id="title">IYF</h1>
    <button class="iconbtn" data-a="lock" aria-label="Kilitle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></button>
  </header>
  <main id="view"></main>
  <nav id="tabs"></nav>
</div>

<div id="sheet" hidden><div class="sheet-card" id="sheetCard"></div></div>
<div id="toast"></div>

<script>
'use strict';
/* =========================================================
   IYF — kişisel, şifreli, sadece bu cihazda çalışan uygulama
   Tüm veriler ana parolandan türetilen anahtarla (PBKDF2 +
   AES-GCM 256) şifrelenip telefonun içinde saklanır.
   ========================================================= */

const STORE = 'iyf.v1';
const ITER = 310000;
const DAYS = ['Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi','Pazar'];
const DS = ['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'];
const MONTHS = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];

const $ = s => document.querySelector(s);
const enc = new TextEncoder(), dec = new TextDecoder();
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const todayIdx = () => (new Date().getDay() + 6) % 7;
const localDate = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

function b64(buf){ const a = new Uint8Array(buf); let s = ''; for (let i = 0; i < a.length; i += 0x8000) s += String.fromCharCode.apply(null, a.subarray(i, i + 0x8000)); return btoa(s); }
function ub64(s){ return Uint8Array.from(atob(s), c => c.charCodeAt(0)); }

/* ---------- Şifreleme ---------- */
let KEY = null, SALT = null, DB = null;

async function deriveKey(pw, salt, iter = ITER){
  const base = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:iter, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}
async function sealDB(key, salt, db){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, enc.encode(JSON.stringify(db)));
  return JSON.stringify({app:'IYF', v:1, salt:b64(salt), iter:ITER, iv:b64(iv), ct:b64(ct)});
}
async function openBlob(blobStr, pw){
  const s = JSON.parse(blobStr);
  const salt = ub64(s.salt);
  const key = await deriveKey(pw, salt, s.iter || ITER);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:ub64(s.iv)}, key, ub64(s.ct));
  return {key, salt, db: JSON.parse(dec.decode(pt))};
}

function emptyDB(){
  return {passwords:[], weekly:[[],[],[],[],[],[],[]], workouts:[[],[],[],[],[],[],[]], courses:[], settings:{autolock:5}, created:Date.now()};
}
function migrate(db){
  const e = emptyDB();
  for (const k in e) if (db[k] === undefined) db[k] = e[k];
  return db;
}

let saveChain = Promise.resolve();
function persist(){
  if (!KEY) return;
  const snapshot = DB;
  saveChain = saveChain.then(async () => {
    try { localStorage.setItem(STORE, await sealDB(KEY, SALT, snapshot)); }
    catch(e){ toast('Kaydedilemedi: ' + e.message); }
  });
  return saveChain;
}

/* ---------- Kilit ---------- */
let fails = 0;
function showLock(){
  KEY = null; DB = null;
  closeSheet();
  $('#app').hidden = true; $('#lock').hidden = false;
  const exists = !!localStorage.getItem(STORE);
  $('#lockTitle').textContent = exists ? 'IYF' : 'IYF\'ye hoş geldin';
  $('#lockSub').textContent = exists ? 'Devam etmek için ana parolanı gir.' : 'Bir ana parola belirle. Tüm verilerin bununla şifrelenecek. Unutursan veriler kurtarılamaz.';
  $('#pw2').hidden = exists;
  $('#pw1').autocomplete = exists ? 'current-password' : 'new-password';
  $('#lockBtn').textContent = exists ? 'Kilidi aç' : 'Oluştur';
  $('#pw1').value = ''; $('#pw2').value = ''; $('#lockErr').textContent = '';
  setTimeout(() => $('#pw1').focus(), 50);
}
function lockErr(msg){
  $('#lockErr').textContent = msg;
  const f = $('#lockForm'); f.classList.remove('shake'); void f.offsetWidth; f.classList.add('shake');
}
$('#lockForm').addEventListener('submit', async e => {
  e.preventDefault();
  const p1 = $('#pw1').value, btn = $('#lockBtn');
  const exists = !!localStorage.getItem(STORE);
  if (!exists){
    if (p1.length < 8) return lockErr('Parola en az 8 karakter olmalı.');
    if (p1 !== $('#pw2').value) return lockErr('Parolalar eşleşmiyor.');
    btn.disabled = true; btn.textContent = 'Hazırlanıyor…';
    SALT = crypto.getRandomValues(new Uint8Array(16));
    KEY = await deriveKey(p1, SALT);
    DB = emptyDB();
    await persist();
    btn.disabled = false;
    try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch {}
    return enterApp();
  }
  btn.disabled = true; btn.textContent = 'Açılıyor…';
  try {
    const r = await openBlob(localStorage.getItem(STORE), p1);
    KEY = r.key; SALT = r.salt; DB = migrate(r.db); fails = 0;
    btn.disabled = false;
    enterApp();
  } catch {
    fails++;
    const wait = fails >= 3 ? Math.min(30, 2 ** (fails - 2)) : 0;
    lockErr(wait ? `Yanlış parola. ${wait} sn bekle.` : 'Yanlış parola.');
    setTimeout(() => { btn.disabled = false; btn.textContent = 'Kilidi aç'; }, wait * 1000);
    $('#pw1').select();
  }
});

/* Otomatik kilit */
let lastActive = Date.now(), hiddenAt = 0;
['pointerdown','keydown','scroll'].forEach(ev => addEventListener(ev, () => lastActive = Date.now(), {passive:true}));
setInterval(() => {
  if (KEY && DB && DB.settings.autolock > 0 && Date.now() - lastActive > DB.settings.autolock * 60000) showLock();
}, 15000);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { hiddenAt = Date.now(); return; }
  if (KEY && DB && hiddenAt && Date.now() - hiddenAt > Math.max(1, DB.settings.autolock) * 60000) showLock();
});

/* ---------- Arayüz ---------- */
const ICONS = {
  home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  vault:'<rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/><circle cx="12" cy="15.5" r="1.5"/>',
  program:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  notes:'<path d="M5 4h11l3 3v13H5z"/><path d="M9 10h6M9 14h6M9 18h3"/>',
  settings:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
  eye:'<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  dice:'<rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1.2" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1.2" fill="currentColor"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/>',
  copy:'<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
};
const svg = (n, w = 2) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${ICONS[n]}</svg>`;

const TABS = [
  ['home','Ana Sayfa'], ['vault','Şifreler'], ['program','Program'], ['notes','Notlar'], ['settings','Ayarlar']
];
const UI = { tab:'home', progMode:'weekly', day:todayIdx(), course:null, q:'' };

function enterApp(){
  $('#lock').hidden = true; $('#app').hidden = false;
  lastActive = Date.now();
  UI.day = todayIdx();
  render();
}

function render(){
  $('#tabs').innerHTML = TABS.map(([k,l]) => `<button data-a="tab" data-k="${k}" class="${UI.tab===k?'on':''}">${svg(k, 1.8)}${l}</button>`).join('');
  const titles = {home:'IYF', vault:'Şifreler', program:'Program', notes:'Ders Notları', settings:'Ayarlar'};
  $('#title').textContent = titles[UI.tab];
  $('#view').innerHTML = VIEWS[UI.tab]();
  if (UI.tab === 'vault') bindSearch();
}

function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 1600);
}
async function copy(text, label = 'Kopyalandı'){
  try { await navigator.clipboard.writeText(text); toast(label); }
  catch { toast('Kopyalanamadı'); }
}
function genPassword(len = 18){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%&*?-_+=';
  const out = []; const buf = new Uint32Array(len * 2); crypto.getRandomValues(buf);
  for (let i = 0; out.length < len; i++){ const v = buf[i % buf.length]; if (v < 4294967296 - (4294967296 % chars.length)) out.push(chars[v % chars.length]); else crypto.getRandomValues(buf); }
  return out.join('');
}

/* ---------- Sheet (alt panel) ---------- */
let sheetSave = null, sheetExtra = {};
function openSheet(html){
  $('#sheetCard').innerHTML = html;
  $('#sheet').hidden = false;
}
function closeSheet(){ $('#sheet').hidden = true; $('#sheetCard').innerHTML = ''; sheetSave = null; sheetExtra = {}; }
$('#sheet').addEventListener('click', e => { if (e.target.id === 'sheet') closeSheet(); });

function field(f){
  const v = esc(f.value ?? '');
  const ph = esc(f.placeholder ?? '');
  let input;
  if (f.type === 'textarea') input = `<textarea class="input" name="${f.name}" placeholder="${ph}">${v}</textarea>`;
  else if (f.type === 'select') input = `<select class="input" name="${f.name}">${f.options.map(([ov,ol]) => `<option value="${esc(ov)}" ${String(ov)===String(f.value)?'selected':''}>${esc(ol)}</option>`).join('')}</select>`;
  else if (f.type === 'secret') input = `<div class="pwfield"><input class="input mono" type="password" name="${f.name}" value="${v}" placeholder="${ph}" autocomplete="off" autocapitalize="off" spellcheck="false"><div class="tools"><button type="button" data-a="pwToggle" aria-label="Göster">${svg('eye')}</button><button type="button" data-a="pwGen" aria-label="Oluştur">${svg('dice')}</button></div></div>`;
  else input = `<input class="input" type="${f.type || 'text'}" name="${f.name}" value="${v}" placeholder="${ph}" ${f.type==='text'||!f.type?'autocapitalize="sentences"':''} autocomplete="off" ${f.inputmode?`inputmode="${f.inputmode}"`:''}>`;
  return `<label class="f">${esc(f.label)}</label>${input}`;
}
function formSheet({title, fields, onSave, onDelete, saveLabel = 'Kaydet'}){
  sheetSave = onSave; sheetExtra.onDelete = onDelete;
  openSheet(`<h2>${esc(title)}</h2><form id="sheetForm">${fields.map(field).join('')}
    <button class="btn" type="submit">${saveLabel}</button>
    ${onDelete ? '<button class="btn danger" type="button" data-a="sheetDelete">Sil</button>' : ''}
    <button class="btn ghost" type="button" data-a="closeSheet">Vazgeç</button></form>`);
  $('#sheetForm').addEventListener('submit', e => {
    e.preventDefault();
    const vals = Object.fromEntries(new FormData(e.target).entries());
    const raw = ['pass','body','old','n1','n2','pw'];
    for (const k in vals) if (typeof vals[k] === 'string' && !raw.includes(k)) vals[k] = vals[k].trim();
    if (sheetSave(vals) === false) return;
    closeSheet(); persist(); render();
  });
}
function confirmSheet(msg, onYes, yesLabel = 'Evet, sil'){
  sheetExtra.onYes = onYes;
  openSheet(`<h2>Emin misin?</h2><p class="hint" style="font-size:15px">${esc(msg)}</p>
    <button class="btn" style="background:var(--danger)" data-a="confirmYes">${esc(yesLabel)}</button>
    <button class="btn ghost" data-a="closeSheet">Vazgeç</button>`);
}

/* ---------- Görünümler ---------- */
const sortByTime = arr => [...arr].sort((a,b) => (a.time||'99').localeCompare(b.time||'99'));
const isDone = w => w.doneOn === localDate();

const VIEWS = {
  home(){
    const d = new Date(), ti = todayIdx();
    const plan = sortByTime(DB.weekly[ti]);
    const wo = DB.workouts[ti];
    const doneCount = wo.filter(isDone).length;
    return `
      <div class="date">${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}, ${DAYS[ti]}</div>
      <div class="card"><h3>Bugünün programı <button class="btn sm ghost" data-a="goProg" data-m="weekly">Düzenle</button></h3>
        ${plan.length ? `<div class="list" style="margin:0;background:var(--card2)">${plan.map(p => `
          <div class="item"><span class="badge">${esc(p.time || '—')}</span><div class="t"><b>${esc(p.title)}</b>${p.note?`<small>${esc(p.note)}</small>`:''}</div></div>`).join('')}</div>`
          : '<div class="empty">Bugün için plan yok.</div>'}
      </div>
      <div class="card"><h3>Bugünün antrenmanı ${wo.length?`<span class="badge">${doneCount}/${wo.length}</span>`:''}</h3>
        ${wo.length ? `<div class="list" style="margin:0;background:var(--card2)">${wo.map(w => workoutRow(w, ti)).join('')}</div>`
          : `<div class="empty">Bugün dinlenme günü. <br><br><button class="btn sm ghost" data-a="goProg" data-m="sport">Antrenman ekle</button></div>`}
      </div>`;
  },

  vault(){
    return `
      <input class="input search" id="q" type="search" placeholder="Ara…" value="${esc(UI.q)}" autocomplete="off">
      <button class="addbtn" data-a="pwAdd">${svg('plus')} Yeni şifre</button>
      <div id="pwList">${pwList()}</div>`;
  },

  program(){
    const isW = UI.progMode === 'weekly';
    const items = isW ? sortByTime(DB.weekly[UI.day]) : DB.workouts[UI.day];
    return `
      <div class="seg"><button data-a="progMode" data-m="weekly" class="${isW?'on':''}">Haftalık</button><button data-a="progMode" data-m="sport" class="${!isW?'on':''}">Spor</button></div>
      <div class="days">${DS.map((n,i) => `<button data-a="day" data-i="${i}" class="${UI.day===i?'on':''} ${todayIdx()===i?'today':''}">${n}</button>`).join('')}</div>
      <div class="list">${items.length ? items.map(it => isW
          ? `<button class="item" data-a="wEdit" data-id="${it.id}"><span class="badge">${esc(it.time || '—')}</span><div class="t"><b>${esc(it.title)}</b>${it.note?`<small>${esc(it.note)}</small>`:''}</div><span class="chev">›</span></button>`
          : workoutRow(it, UI.day, true)).join('')
        : `<div class="empty">${DAYS[UI.day]} için ${isW ? 'plan' : 'antrenman'} yok.</div>`}</div>
      <button class="addbtn" data-a="${isW ? 'wAdd' : 'sAdd'}">${svg('plus')} ${isW ? 'Plan ekle' : 'Egzersiz ekle'}</button>
      ${!isW && items.length ? `<button class="btn ghost" data-a="sCopy">Bu günü başka güne kopyala</button>` : ''}`;
  },

  notes(){
    if (UI.course){
      const c = DB.courses.find(x => x.id === UI.course);
      if (!c){ UI.course = null; return VIEWS.notes(); }
      const notes = [...c.notes].sort((a,b) => b.updated - a.updated);
      return `
        <button class="back" data-a="courseBack">‹ Dersler</button>
        <div class="row" style="margin-bottom:12px"><div class="hello" style="margin:0">${esc(c.name)}</div><button class="btn sm ghost" style="flex:none" data-a="courseEdit" data-id="${c.id}">Düzenle</button></div>
        <button class="addbtn" data-a="noteAdd">${svg('plus')} Yeni not</button>
        <div class="list">${notes.length ? notes.map(n => `
          <button class="item" data-a="noteEdit" data-id="${n.id}"><div class="t"><b>${esc(n.title || 'Başlıksız')}</b><small>${new Date(n.updated).toLocaleDateString('tr-TR')} · ${esc((n.body||'').slice(0,60).replace(/\n/g,' '))}</small></div><span class="chev">›</span></button>`).join('')
          : '<div class="empty">Bu derste henüz not yok.</div>'}</div>`;
    }
    return `
      <button class="addbtn" data-a="courseAdd">${svg('plus')} Ders ekle</button>
      <div class="list">${DB.courses.length ? DB.courses.map(c => `
        <button class="item" data-a="courseOpen" data-id="${c.id}"><div class="avatar">${esc(c.name.slice(0,1).toUpperCase())}</div><div class="t"><b>${esc(c.name)}</b><small>${c.notes.length} not</small></div><span class="chev">›</span></button>`).join('')
        : '<div class="empty">Henüz ders yok. Örn. "Makro İktisat I" ekleyebilirsin.</div>'}</div>`;
  },

  settings(){
    return `
      <div class="card"><h3>Güvenlik</h3>
        <label class="f">Otomatik kilit</label>
        <select class="input" id="autolock">${[[1,'1 dakika'],[3,'3 dakika'],[5,'5 dakika'],[10,'10 dakika'],[30,'30 dakika']].map(([v,l]) => `<option value="${v}" ${DB.settings.autolock==v?'selected':''}>${l}</option>`).join('')}</select>
        <button class="btn ghost" data-a="changePw">Ana parolayı değiştir</button>
      </div>
      <div class="card"><h3>Yedek</h3>
        <p class="hint" style="margin-top:0">Yedek dosyası da şifrelidir; açmak için ana parolan gerekir. Ara sıra yedek alıp iCloud Drive'a (Dosyalar) kaydet.</p>
        <button class="btn" data-a="exportBk">Yedek al</button>
        <button class="btn ghost" data-a="importBk">Yedekten geri yükle</button>
        <input type="file" id="bkFile" accept=".json,application/json" hidden>
      </div>
      <div class="card"><h3>Tehlikeli bölge</h3>
        <button class="btn danger" data-a="wipe">Tüm verileri sil</button>
      </div>
      <p class="hint" style="text-align:center">IYF v1 · Veriler sadece bu cihazda, AES-256 ile şifreli.</p>`;
  },
};

function pwList(){
  const q = UI.q.toLocaleLowerCase('tr');
  const list = DB.passwords
    .filter(p => !q || [p.title,p.user,p.url].some(x => (x||'').toLocaleLowerCase('tr').includes(q)))
    .sort((a,b) => a.title.localeCompare(b.title, 'tr'));
  if (!list.length) return `<div class="list"><div class="empty">${q ? 'Sonuç yok.' : 'Henüz şifre eklemedin.'}</div></div>`;
  return `<div class="list">${list.map(p => `
    <button class="item" data-a="pwView" data-id="${p.id}"><div class="avatar">${esc((p.title||'?').slice(0,1).toUpperCase())}</div><div class="t"><b>${esc(p.title)}</b><small>${esc(p.user || p.url || '')}</small></div><span class="chev">›</span></button>`).join('')}</div>`;
}
function bindSearch(){
  const q = $('#q');
  q.addEventListener('input', () => { UI.q = q.value; $('#pwList').innerHTML = pwList(); });
}
function workoutRow(w, day, editable){
  const d = isDone(w);
  const meta = [w.sets && w.reps ? `${w.sets}×${w.reps}` : (w.sets ? `${w.sets} set` : w.reps ? `${w.reps} tekrar` : ''), w.weight ? `${w.weight} kg` : '', w.note].filter(Boolean).join(' · ');
  return `<div class="item ${d?'done':''}"><button class="check ${d?'on':''}" data-a="sDone" data-id="${w.id}" data-d="${day}" aria-label="Tamamlandı"></button>
    <div class="t" ${editable?`data-a="sEdit" data-id="${w.id}" style="cursor:pointer"`:''}><b>${esc(w.name)}</b>${meta?`<small>${esc(meta)}</small>`:''}</div>${editable?'<span class="chev">›</span>':''}</div>`;
}

/* ---------- Aksiyonlar ---------- */
const findPw = id => DB.passwords.find(p => p.id === id);
const A = {
  tab: d => { UI.tab = d.k; if (d.k !== 'notes') UI.course = null; render(); scrollTo(0,0); },
  lock: () => showLock(),
  closeSheet: () => closeSheet(),
  sheetDelete: () => { const f = sheetExtra.onDelete; closeSheet(); confirmSheet('Bu kayıt kalıcı olarak silinecek.', f); },
  confirmYes: () => { const f = sheetExtra.onYes; closeSheet(); f && f(); persist(); render(); },
  goProg: d => { UI.tab = 'program'; UI.progMode = d.m; UI.day = todayIdx(); render(); },

  /* Şifreler */
  pwToggle: (d, el) => { const i = el.closest('.pwfield').querySelector('input'); i.type = i.type === 'password' ? 'text' : 'password'; },
  pwGen: (d, el) => { const i = el.closest('.pwfield').querySelector('input'); i.value = genPassword(); i.type = 'text'; },
  pwAdd: () => pwForm(),
  pwView: d => {
    const p = findPw(d.id); if (!p) return;
    sheetExtra.id = p.id;
    const kv = (label, val, key, secret) => val ? `<div class="kv"><div class="t"><small>${label}</small><span class="${secret?'mono':''}" ${secret?'data-secret="1"':''}>${secret ? '••••••••••' : esc(val)}</span></div>
      ${secret ? `<button class="iconbtn" data-a="pwReveal" aria-label="Göster">${svg('eye')}</button>` : ''}
      <button class="iconbtn" data-a="pwCopy" data-k="${key}" aria-label="Kopyala">${svg('copy')}</button></div>` : '';
    openSheet(`<h2>${esc(p.title)}</h2>
      ${kv('Kullanıcı adı / e-posta', p.user, 'user')}
      ${kv('Şifre', p.pass, 'pass', true)}
      ${kv('Site / uygulama', p.url, 'url')}
      ${p.note ? `<div class="kv"><div class="t"><small>Not</small><span class="note-body">${esc(p.note)}</span></div></div>` : ''}
      <p class="hint">Son değişiklik: ${new Date(p.updated).toLocaleString('tr-TR')}</p>
      <button class="btn" data-a="pwEdit">Düzenle</button>
      <button class="btn ghost" data-a="closeSheet">Kapat</button>`);
  },
  pwReveal: (d, el) => { const s = el.closest('.kv').querySelector('[data-secret]'); const p = findPw(sheetExtra.id); s.textContent = s.textContent.startsWith('•') ? p.pass : '••••••••••'; },
  pwCopy: d => { const p = findPw(sheetExtra.id); copy(p[d.k], d.k === 'pass' ? 'Şifre kopyalandı' : 'Kopyalandı'); },
  pwEdit: () => { const id = sheetExtra.id; closeSheet(); pwForm(findPw(id)); },

  /* Program */
  progMode: d => { UI.progMode = d.m; render(); },
  day: d => { UI.day = +d.i; render(); },
  wAdd: () => weeklyForm(),
  wEdit: d => weeklyForm(DB.weekly[UI.day].find(x => x.id === d.id)),
  sAdd: () => workoutForm(),
  sEdit: d => workoutForm(DB.workouts[UI.day].find(x => x.id === d.id)),
  sDone: d => { const w = DB.workouts[+d.d].find(x => x.id === d.id); w.doneOn = isDone(w) ? null : localDate(); persist(); render(); },
  sCopy: () => formSheet({
    title: `${DAYS[UI.day]} antrenmanını kopyala`,
    fields: [{name:'to', label:'Hangi güne?', type:'select', value:(UI.day+1)%7, options:DAYS.map((n,i)=>[i,n]).filter(([i]) => i !== UI.day)}],
    saveLabel: 'Kopyala (üzerine ekler)',
    onSave: v => { DB.workouts[+v.to].push(...DB.workouts[UI.day].map(w => ({...w, id:uid(), doneOn:null}))); toast(`${DAYS[+v.to]} gününe kopyalandı`); }
  }),

  /* Notlar */
  courseAdd: () => courseForm(),
  courseEdit: d => courseForm(DB.courses.find(c => c.id === d.id)),
  courseOpen: d => { UI.course = d.id; render(); scrollTo(0,0); },
  courseBack: () => { UI.course = null; render(); },
  noteAdd: () => noteForm(),
  noteEdit: d => noteForm(DB.courses.find(c => c.id === UI.course).notes.find(n => n.id === d.id)),

  /* Ayarlar */
  changePw: () => formSheet({
    title: 'Ana parolayı değiştir',
    fields: [{name:'old', label:'Mevcut parola', type:'password'}, {name:'n1', label:'Yeni parola (en az 8)', type:'password'}, {name:'n2', label:'Yeni parola (tekrar)', type:'password'}],
    onSave: v => {
      if (v.n1.length < 8) { toast('En az 8 karakter'); return false; }
      if (v.n1 !== v.n2) { toast('Yeni parolalar eşleşmiyor'); return false; }
      (async () => {
        try { await openBlob(localStorage.getItem(STORE), v.old); } catch { toast('Mevcut parola yanlış'); return; }
        SALT = crypto.getRandomValues(new Uint8Array(16));
        KEY = await deriveKey(v.n1, SALT);
        await persist(); toast('Ana parola değişti');
      })();
    }
  }),
  exportBk: async () => {
    await saveChain;
    const data = localStorage.getItem(STORE);
    const name = `IYF-yedek-${localDate()}.json`;
    const file = new File([data], name, {type:'application/json'});
    if (navigator.canShare && navigator.canShare({files:[file]})) {
      try { await navigator.share({files:[file], title:name}); return; } catch(e) { if (e.name === 'AbortError') return; }
    }
    const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  },
  importBk: () => $('#bkFile').click(),
  wipe: () => confirmSheet('Şifreler, programlar ve notlar dahil HER ŞEY bu cihazdan silinecek. Yedeğin yoksa geri dönüşü yok.', () => { localStorage.removeItem(STORE); showLock(); }, 'Her şeyi sil'),
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if (!el || !A[el.dataset.a]) return;
  e.preventDefault();
  A[el.dataset.a](el.dataset, el, e);
});
document.addEventListener('change', e => {
  if (e.target.id === 'autolock') { DB.settings.autolock = +e.target.value; persist(); toast('Kaydedildi'); }
  if (e.target.id === 'bkFile' && e.target.files[0]) {
    const f = e.target.files[0];
    f.text().then(txt => {
      let ok = false; try { ok = JSON.parse(txt).app === 'IYF'; } catch {}
      if (!ok) return toast('Geçerli bir IYF yedeği değil');
      formSheet({
        title: 'Yedeği geri yükle',
        fields: [{name:'pw', label:'Bu yedeğin ana parolası', type:'password'}],
        saveLabel: 'Geri yükle (mevcut verilerin yerine geçer)',
        onSave: v => {
          (async () => {
            try { const r = await openBlob(txt, v.pw); KEY = r.key; SALT = r.salt; DB = migrate(r.db); await persist(); toast('Yedek yüklendi'); render(); }
            catch { toast('Parola yanlış ya da dosya bozuk'); }
          })();
        }
      });
    });
    e.target.value = '';
  }
});

/* ---------- Formlar ---------- */
function pwForm(p){
  formSheet({
    title: p ? 'Şifreyi düzenle' : 'Yeni şifre',
    fields: [
      {name:'title', label:'Başlık', value:p?.title, placeholder:'Örn. Instagram, Ziraat Bankası'},
      {name:'user', label:'Kullanıcı adı / e-posta', value:p?.user},
      {name:'pass', label:'Şifre', type:'secret', value:p?.pass},
      {name:'url', label:'Site / uygulama', value:p?.url, placeholder:'instagram.com'},
      {name:'note', label:'Not', type:'textarea', value:p?.note},
    ],
    onSave: v => {
      if (!v.title) { toast('Başlık gerekli'); return false; }
      if (p) Object.assign(p, v, {updated:Date.now()});
      else DB.passwords.push({id:uid(), ...v, created:Date.now(), updated:Date.now()});
    },
    onDelete: p && (() => { DB.passwords = DB.passwords.filter(x => x.id !== p.id); }),
  });
}
function weeklyForm(it){
  const day = UI.day;
  formSheet({
    title: it ? 'Planı düzenle' : `${DAYS[day]} için plan`,
    fields: [
      {name:'time', label:'Saat', type:'time', value:it?.time},
      {name:'title', label:'Ne yapılacak?', value:it?.title, placeholder:'Örn. Makro İktisat dersi'},
      {name:'note', label:'Not (isteğe bağlı)', value:it?.note, placeholder:'Örn. B-204'},
      ...(it ? [] : [{name:'repeat', label:'Tekrar', type:'select', value:'no', options:[['no','Sadece bu gün'],['weekdays','Hafta içi her gün'],['all','Her gün']]}]),
    ],
    onSave: v => {
      if (!v.title) { toast('Başlık gerekli'); return false; }
      if (it) { Object.assign(it, {time:v.time, title:v.title, note:v.note}); return; }
      const days = v.repeat === 'weekdays' ? [0,1,2,3,4] : v.repeat === 'all' ? [0,1,2,3,4,5,6] : [day];
      days.forEach(i => DB.weekly[i].push({id:uid(), time:v.time, title:v.title, note:v.note}));
    },
    onDelete: it && (() => { DB.weekly[day] = DB.weekly[day].filter(x => x.id !== it.id); }),
  });
}
function workoutForm(w){
  const day = UI.day;
  formSheet({
    title: w ? 'Egzersizi düzenle' : `${DAYS[day]} için egzersiz`,
    fields: [
      {name:'name', label:'Egzersiz', value:w?.name, placeholder:'Örn. Bench Press'},
      {name:'sets', label:'Set', type:'number', inputmode:'numeric', value:w?.sets, placeholder:'4'},
      {name:'reps', label:'Tekrar / süre', value:w?.reps, placeholder:'10 veya 30 sn'},
      {name:'weight', label:'Ağırlık (kg)', type:'number', inputmode:'decimal', value:w?.weight},
      {name:'note', label:'Not', value:w?.note},
    ],
    onSave: v => {
      if (!v.name) { toast('Egzersiz adı gerekli'); return false; }
      if (w) Object.assign(w, v); else DB.workouts[day].push({id:uid(), ...v, doneOn:null});
    },
    onDelete: w && (() => { DB.workouts[day] = DB.workouts[day].filter(x => x.id !== w.id); }),
  });
}
function courseForm(c){
  formSheet({
    title: c ? 'Dersi düzenle' : 'Yeni ders',
    fields: [{name:'name', label:'Ders adı', value:c?.name, placeholder:'Örn. Makro İktisat I'}],
    onSave: v => {
      if (!v.name) { toast('Ders adı gerekli'); return false; }
      if (c) c.name = v.name; else DB.courses.push({id:uid(), name:v.name, notes:[]});
    },
    onDelete: c && (() => { DB.courses = DB.courses.filter(x => x.id !== c.id); UI.course = null; }),
  });
}
function noteForm(n){
  const c = DB.courses.find(x => x.id === UI.course);
  formSheet({
    title: n ? 'Notu düzenle' : 'Yeni not',
    fields: [{name:'title', label:'Başlık', value:n?.title, placeholder:'Örn. Keynesyen model'}, {name:'body', label:'Not', type:'textarea', value:n?.body}],
    onSave: v => {
      if (!v.title && !v.body.trim()) { toast('Boş not kaydedilmez'); return false; }
      if (n) Object.assign(n, v, {updated:Date.now()});
      else c.notes.push({id:uid(), ...v, created:Date.now(), updated:Date.now()});
    },
    onDelete: n && (() => { c.notes = c.notes.filter(x => x.id !== n.id); }),
  });
}

/* ---------- Başlat ---------- */
if (!window.isSecureContext || !crypto.subtle) {
  document.body.innerHTML = '<div style="padding:40px 24px;text-align:center">IYF güvenli (https) bir adresten açılmalı.</div>';
} else {
  showLock();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
